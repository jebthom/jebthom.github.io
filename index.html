<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeb Thomas-Mitchell</title>
  <meta name="description" content="HCI/AI researcher at the University of Toronto studying human-AI creative collaboration.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x269B;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;1,400&family=Familjen+Grotesk:wght@400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* ── Palette ── */
    :root {
      --forest:   #1F3A32;
      --forest-dk:#14261F;
      --cream:    #F3EFE4;
      --sky:      #AFCDDD;
      --pink:     #E5D2CC;
      --sage:     #9CC5B2;
      --peach:    #D98E62;
      --bean:     #7DC0AE;
      --dark:     #3A241B;
    }

    /* ── Typography ── */
    .t-display { font-family: 'Syne', 'Bricolage Grotesque', sans-serif; font-weight: 400; letter-spacing: -0.01em; }
    .t-body    { font-family: 'Familjen Grotesk', 'Inter', sans-serif; font-weight: 400; }
    .t-mono    { font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; }

    /* ── Theme root ── */
    .theme-root {
      min-height: 100vh;
      transition: background 220ms, color 220ms;
      position: relative;
      overflow: hidden;
      padding-top: 62px;
    }

    /* ── Nav ── */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 18px 40px;
      display: flex; justify-content: space-between; align-items: center;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.12);
      border-bottom: 1px solid rgba(243,239,228,0.12);
    }
    .nav-brand { font-size: 20px; color: var(--cream); }
    .nav-brand .dot { color: var(--sage); }
    .nav-pills { display: flex; gap: 8px; }
    .nav-pill {
      font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 400;
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(243,239,228,0.4);
      border-radius: 999px; padding: 8px 18px;
      cursor: pointer; transition: all 140ms;
    }
    .nav-email { color: var(--cream); opacity: 0.7; }

    /* ── Footer ── */
    .site-footer {
      padding: 24px 56px;
      display: flex; justify-content: space-between;
      opacity: 0.7;
    }

    /* ── Pages ── */
    .page { display: none; padding: 40px 56px 56px; position: relative; max-width: 1400px; margin: 0 auto; }
    .page.active { display: block; }

    /* ── Home layout ── */
    .home-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      grid-template-areas: "text blob" "text bottom";
      gap: 60px; align-items: start;
    }
    .home-text-col { grid-area: text; }
    .home-grid .blob-wrap { grid-area: blob; }
    .home-bottom { grid-area: bottom; }
    .home-name { font-size: 110px; line-height: 0.9; letter-spacing: -0.02em; }
    .home-name .dot { color: var(--sage); }
    .home-bio p { font-size: 18px; line-height: 1.55; margin-top: 14px; max-width: 600px; opacity: 0.9; }
    .home-bio p:first-child { margin-top: 28px; }
    .home-bio a { color: var(--sage); }
    .home-papers-label { opacity: 0.7; margin-bottom: 8px; }
    .home-bottom {
      margin-top: 40px; display: grid; grid-template-columns: 1fr; gap: 32px; align-items: start;
    }

    /* ── Blob canvas ── */
    .blob-wrap { position: relative; }
    .blob-canvas { display: block; width: 100%; }
    .headshot-overlay {
      position: absolute;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
    }
    .headshot-overlay img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Paper row ── */
    .paper-row {
      display: grid; gap: 16px; align-items: start;
      border-top: 1px solid rgba(243,239,228,0.18);
    }
    .paper-row.compact { grid-template-columns: 68px 1fr auto; padding: 18px 0; }
    .paper-row.full    { grid-template-columns: 90px 1fr auto; padding: 22px 0; }
    .paper-row .venue-year { opacity: 0.75; }
    .paper-row .title { line-height: 1.25; margin-top: 6px; }
    .paper-row.compact .title { font-size: 20px; }
    .paper-row.full .title   { font-size: 22px; }
    .paper-row .authors { font-size: 12.5px; opacity: 0.7; margin-top: 6px; }
    .paper-row .arrow { font-size: 22px; opacity: 0.55; align-self: start; padding-top: 4px; }
    .paper-links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

    /* ── Link pill ── */
    .link-pill {
      font-family: 'DM Mono', monospace; font-size: 10px;
      letter-spacing: 0.2em; text-transform: uppercase;
      padding: 5px 11px; border-radius: 999px;
      text-decoration: none; display: inline-block;
    }
    .link-pill.on-dark  { background: rgba(243,239,228,0.1); color: var(--cream); border: 1px solid rgba(243,239,228,0.08); }
    .link-pill.on-light { background: rgba(31,58,50,0.1); color: var(--forest-dk); border: 1px solid rgba(20,38,31,0.08); }

    /* ── Paper thumb SVG ── */
    .paper-thumb { display: block; border-radius: 12px; overflow: hidden; flex-shrink: 0; }

    /* ── Social pills ── */
    .social-pill {
      font-family: 'DM Mono', monospace; font-size: 10.5px;
      letter-spacing: 0.2em; text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(243,239,228,0.4);
      padding: 8px 12px; border-radius: 999px;
    }
    .socials-wrap { display: flex; flex-wrap: wrap; gap: 8px; }

    /* ── Bulletin ── */
    .bulletin-item {
      font-size: 13px; padding: 8px 0; opacity: 0.9;
      border-top: 1px solid rgba(243,239,228,0.15);
    }
    .bulletin-date { opacity: 0.6; margin-right: 8px; }

    /* ── Interior pages ── */
    .page-header { max-width: 900px; position: relative; z-index: 2; }
    .page-header .label { opacity: 0.65; }
    .page-header h1 { font-size: 88px; line-height: 0.95; margin: 10px 0 0; }
    .page-header h1 .dot { color: var(--forest); }
    .page-header .desc { font-size: 18px; line-height: 1.55; margin-top: 18px; max-width: 680px; opacity: 0.8; }

    /* ── Interior: dark text adjustments ── */
    .page-dark .paper-row { border-top-color: rgba(20,38,31,0.18); }

    /* ── Pebbles ── */
    .pebble { position: absolute; pointer-events: none; }

    /* ── Teaching ── */
    .teaching-philosophy { max-width: 820px; position: relative; z-index: 2; }
    .teaching-philosophy p { font-size: 18px; line-height: 1.6; margin: 0 0 16px; opacity: 0.9; }
    .courses-section { margin-top: 48px; max-width: 1040px; position: relative; z-index: 2; }
    .course-row {
      display: grid; grid-template-columns: 100px 1fr 160px 120px;
      gap: 24px; padding: 22px 0; align-items: baseline;
      border-bottom: 1px solid rgba(20,38,31,0.13);
    }
    .course-code { opacity: 0.75; }
    .course-title { font-size: 24px; line-height: 1.2; }
    .course-blurb { font-size: 13.5px; margin-top: 6px; opacity: 0.8; }
    .course-level { font-size: 13px; opacity: 0.75; }
    .course-meta { opacity: 0.6; text-align: right; }

    /* ── Projects grid ── */
    .projects-grid {
      margin-top: 36px;
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 18px; position: relative; z-index: 2;
    }
    .project-card {
      display: block; position: relative;
      border-radius: 18px; overflow: hidden;
      aspect-ratio: 1 / 1;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }
    .project-card .card-bg { position: absolute; inset: 0; }
    .project-card .card-gradient {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(20,38,31,0.78) 0%, rgba(20,38,31,0.1) 50%, transparent 100%);
    }
    .project-card .card-text {
      position: absolute; left: 18px; right: 18px; bottom: 16px;
      color: var(--cream);
    }
    .project-card .card-label { opacity: 0.8; font-size: 9.5px; }
    .project-card .card-title { font-size: 26px; line-height: 1.1; margin-top: 4px; }
    .project-card .card-sub { font-size: 12px; opacity: 0.85; margin-top: 4px; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .home-grid { grid-template-columns: 1fr; grid-template-areas: none; gap: 20px; }
      .home-grid .blob-wrap { order: -1; }
      .home-name { font-size: 64px; }
      .home-bottom { grid-template-columns: 1fr; }
      .page-header h1 { font-size: 52px; }
      .projects-grid { grid-template-columns: repeat(2, 1fr); }
      .course-row { grid-template-columns: 80px 1fr; }
      .course-level, .course-meta { display: none; }
      .top-nav { padding: 10px 16px; flex-wrap: wrap; gap: 6px; }
      .nav-brand { font-size: 16px; }
      .nav-pill { font-size: 13px; padding: 6px 14px; }
      .nav-email { display: none; }
      .page { padding: 20px 24px 40px; }
      .site-footer { padding: 20px 24px; }
    }
    @media (max-width: 600px) {
      .home-name { font-size: 48px; }
      .projects-grid { grid-template-columns: 1fr 1fr; }
      .nav-pills { flex-wrap: wrap; }
      .nav-pill { font-size: 12px; padding: 5px 12px; }
    }
  </style>
</head>
<body>

<div class="theme-root" id="themeRoot">

  <!-- ═══ NAV ═══ -->
  <nav class="top-nav">
    <div class="nav-brand t-display">Jeb Thomas-Mitchell<span class="dot">.</span></div>
    <div class="nav-pills">
      <button class="nav-pill" data-page="home">Home</button>
      <button class="nav-pill" data-page="research">Research</button>
      <button class="nav-pill" data-page="teaching">Teaching</button>
      <!-- <button class="nav-pill" data-page="projects">Projects</button> -->
    </div>
    <div class="nav-email t-mono" id="navEmail"></div>
  </nav>

  <!-- Pages are rendered by JS from site-data.json -->
  <div id="pageContainer"></div>

  <!-- ═══ FOOTER ═══ -->
  <footer class="site-footer t-mono" id="siteFooter">
    <span id="footerAffiliation"></span>
    <span id="footerEmail"></span>
  </footer>

</div>

<script>
// ── Thumb SVG generators (keyed by kind) ──
function renderThumbSVG(thumb, size) {
  var p = thumb.palette, k = thumb.kind || 'orb';
  var inner = '';
  switch (k) {
    case 'orb':
      inner = '<circle cx="40" cy="40" r="26" fill="'+p[0]+'"/><circle cx="30" cy="32" r="10" fill="'+p[1]+'"/><circle cx="52" cy="52" r="5" fill="'+p[2]+'"/>';
      break;
    case 'grid':
      inner = '<g stroke="'+p[0]+'" stroke-width="1.5" fill="none">'
        + [15,30,45,60].map(function(v){return '<line x1="8" y1="'+v+'" x2="72" y2="'+v+'"/>';}).join('')
        + [15,30,45,60].map(function(v){return '<line x1="'+v+'" y1="8" x2="'+v+'" y2="72"/>';}).join('')
        + '<rect x="22" y="22" width="36" height="36" fill="'+p[1]+'" opacity="0.9"/></g>';
      break;
    case 'wave':
      inner = '<g fill="'+p[0]+'"><path d="M0,50 Q20,30 40,50 T80,50 L80,80 L0,80 Z"/>'
        + '<path d="M0,60 Q20,44 40,60 T80,60 L80,80 L0,80 Z" fill="'+p[1]+'" opacity="0.9"/></g>';
      break;
    case 'bars':
      inner = [10,25,40,55,70].map(function(x,i){
        var h = i%3===0?50:i%2===0?35:22;
        return '<rect x="'+(x-4)+'" y="'+(70-h)+'" width="8" height="'+h+'" fill="'+(i%2?p[0]:p[1])+'"/>';
      }).join('');
      break;
    case 'dot':
      var dots = [];
      for(var r=0;r<4;r++) for(var c=0;c<4;c++)
        dots.push('<circle cx="'+(12+c*19)+'" cy="'+(12+r*19)+'" r="'+((r+c)%2?5:3)+'" fill="'+((r+c)%3===0?p[0]:p[1])+'"/>');
      inner = '<g>'+dots.join('')+'</g>';
      break;
    case 'ring':
      inner = '<circle cx="40" cy="40" r="28" fill="none" stroke="'+p[0]+'" stroke-width="6"/>'
        + '<circle cx="40" cy="40" r="16" fill="none" stroke="'+p[1]+'" stroke-width="4"/>'
        + '<circle cx="40" cy="40" r="4" fill="'+p[0]+'"/>';
      break;
    case 'cross':
      inner = '<rect x="34" y="12" width="12" height="56" fill="'+p[0]+'"/>'
        + '<rect x="12" y="34" width="56" height="12" fill="'+p[1]+'"/>';
      break;
    case 'step':
      inner = '<g fill="'+p[0]+'">'
        + '<rect x="10" y="54" width="14" height="18"/>'
        + '<rect x="24" y="42" width="14" height="30" fill="'+p[1]+'"/>'
        + '<rect x="38" y="30" width="14" height="42"/>'
        + '<rect x="52" y="18" width="14" height="54" fill="'+p[1]+'"/></g>';
      break;
  }
  return '<svg class="paper-thumb" width="'+size+'" height="'+size+'" viewBox="0 0 80 80">'
    + '<rect width="80" height="80" fill="'+p[2]+'"/>' + inner + '</svg>';
}

// ── Build link pills ──
function linkPills(links, variant) {
  var cls = variant === 'dark' ? 'on-dark' : 'on-light';
  var labels = { pdf:'PDF', arxiv:'arXiv', acm:'ACM', project:'Project', db:'Database' };
  var out = '';
  for (var k in links) {
    if (links[k]) out += '<a href="'+links[k]+'" class="link-pill '+cls+'">'+labels[k]+' ↗</a>';
  }
  return out;
}

// ── Build a paper row ──
function paperRow(p, variant) {
  var full = variant === 'full';
  var sz = full ? 90 : 68;
  return '<div class="paper-row '+(full?'full':'compact')+'">'
    + renderThumbSVG(p.thumb, sz)
    + '<div>'
    + '<div class="t-mono venue-year">'+p.venue+' · '+p.year+'</div>'
    + '<div class="t-display title">'+p.title+'</div>'
    + '<div class="t-body authors">'+p.authors+'</div>'
    + '<div class="paper-links">'+linkPills(p.links, full?'light':'dark')+'</div>'
    + '</div>'
    + '<div class="t-display arrow">↗</div>'
    + '</div>';
}

// ── Build project card ──
function projectCard(p) {
  return '<a class="project-card" href="'+p.href+'" style="background:'+p.thumb.palette[2]+'">'
    + '<div class="card-bg">'
    + '<svg width="100%" height="100%" viewBox="0 0 80 80" preserveAspectRatio="xMidYMid slice">'
    + '<rect width="80" height="80" fill="'+p.thumb.palette[2]+'"/>'
    + renderThumbSVG(p.thumb, 80).replace(/<svg[^>]*>|<\/svg>/g,'').replace(/<rect width="80"[^/]*\/>/,'')
    + '</svg></div>'
    + '<div class="card-gradient"></div>'
    + '<div class="card-text">'
    + '<div class="t-mono card-label">Project ↗</div>'
    + '<div class="t-display card-title">'+p.title+'</div>'
    + '<div class="t-body card-sub">'+p.subtitle+'</div>'
    + '</div></a>';
}

// ── Pebble SVG paths ──
var PEBBLE = [
  "M40,10 Q80,0 90,40 Q100,85 55,95 Q10,90 10,55 Q5,20 40,10 Z",
  "M30,20 Q70,5 85,35 Q95,70 50,85 Q15,85 15,50 Q10,25 30,20 Z",
  "M20,30 Q60,10 80,30 Q95,60 60,80 Q20,85 15,55 Q10,35 20,30 Z",
  "M25,15 Q70,15 85,45 Q90,80 50,90 Q15,85 10,50 Q10,20 25,15 Z"
];
function pebble(top,left,sz,rot,color,idx,op) {
  return '<svg class="pebble" style="top:'+top+';left:'+left+';width:'+sz+'px;height:'+sz+'px;transform:rotate('+rot+'deg);opacity:'+op+'" viewBox="0 0 100 100"><path d="'+PEBBLE[idx%4]+'" fill="'+color+'"/></svg>';
}

// ── Main render ──
fetch('site-data.json').then(function(r){return r.json();}).then(function(S) {
  // Footer + nav email
  document.getElementById('navEmail').textContent = S.email;
  document.getElementById('footerAffiliation').textContent = S.affiliation;
  document.getElementById('footerEmail').textContent = S.email;

  var html = '';

  // ════════════════ HOME ════════════════
  html += '<div class="page" id="page-home">';
  html += '<div class="home-grid"><div class="home-text-col">';
  html += '<div class="home-name t-display">Jeb<br>Thomas-<wbr>Mitchell<span class="dot">.</span></div>';
  html += '<div class="home-bio t-body">';
  S.bio.forEach(function(p){ html += '<p>'+p+'</p>'; });
  html += '</div>';
  html += '<div style="margin-top:40px"><div class="home-papers-label t-mono">— Recent papers</div>';
  S.papers.slice(0,3).forEach(function(p){ html += paperRow(p, 'compact'); });
  html += '</div></div>';

  // Blob canvas
  html += '<div class="blob-wrap">'
    + '<svg class="blob-canvas" viewBox="0 0 600 680">'
    + '<g transform="translate(-32.109 -8.132) rotate(0 190 225)"><path d="M80,170 Q60,290 160,330 Q280,360 300,250 Q310,140 210,120 Q90,100 80,170 Z" fill="var(--sky)"/></g>'
    + '<g transform="translate(-20.91 0) rotate(0 300 90)"><ellipse cx="300" cy="90" rx="72" ry="54" fill="var(--cream)"/></g>'
    + '<g transform="translate(37.557 7.875) rotate(0 200 320)"><circle cx="200" cy="320" r="18" fill="var(--dark)"/></g>'
    + '<g transform="translate(-37.557 -24.836) rotate(109 260 450)"><path d="M205,320 Q150,420 200,580 Q270,500 330,420 Q310,350 205,320 Z" fill="var(--peach)"/></g>'
    + '<g transform="translate(37.766 -73.214) rotate(37 130 560)"><ellipse cx="130" cy="560" rx="55" ry="40" fill="var(--pink)"/></g>'
    + '<g transform="translate(20.43 -49.256) rotate(-68 400 525)"><path d="M340,540 Q280,480 330,450 Q420,420 470,480 Q510,540 460,580 Q380,610 340,540 Z" fill="var(--bean)"/></g>'
    + '<g transform="translate(21.201 -52.095) rotate(0 400 290)"><ellipse cx="400" cy="290" rx="160" ry="140" fill="var(--cream)"/></g>'
    + '</svg>'
    + '<div class="headshot-overlay" style="left:30%;top:20%;width:61%;height:55%;transform:translate(3.53%,-7.66%);">'
    + '<img src="'+S.headshot+'" alt="'+S.name+' headshot"></div></div>';

  // Bottom section: Elsewhere + Bulletin
  html += '<section class="home-bottom"><div>';
  html += '<div class="t-mono" style="opacity:0.7;margin-bottom:10px">— Elsewhere</div>';
  html += '<div class="socials-wrap">';
  S.socials.forEach(function(s){
    html += '<a href="'+s.href+'" class="social-pill" style="color:var(--cream);">'+s.label+'</a>';
  });
  html += '</div></div><div>';
  html += '<div class="t-mono" style="opacity:0.7;margin-bottom:10px">— Bulletin</div>';
  S.news.forEach(function(n){
    html += '<div class="bulletin-item t-body"><span class="t-mono bulletin-date">'+n.date+'</span>'+n.text+'</div>';
  });
  html += '</div></section></div></div>';

  // ════════════════ RESEARCH ════════════════
  html += '<div class="page page-dark" id="page-research">';
  html += pebble('6%','78%',150,20,'var(--cream)',0,0.85);
  html += pebble('34%','-4%',110,-30,'var(--sage)',1,0.75);
  html += pebble('68%','88%',130,45,'var(--pink)',2,0.9);
  html += pebble('82%','4%',80,-15,'var(--peach)',3,0.7);
  html += '<header class="page-header">';
  html += '<div class="t-mono label">— Research</div>';
  html += '<h1 class="t-display">Papers<span class="dot">.</span></h1>';
  html += '<p class="t-body desc">'+S.researchBlurb+'</p></header>';
  html += '<section style="margin-top:32px;max-width:980px;position:relative;z-index:2">';
  S.papers.forEach(function(p){ html += paperRow(p, 'full'); });
  html += '</section></div>';

  // ════════════════ TEACHING ════════════════
  html += '<div class="page page-dark" id="page-teaching">';
  html += pebble('8%','84%',130,-20,'var(--cream)',1,0.8);
  html += pebble('44%','-3%',100,30,'var(--sky)',2,0.75);
  html += pebble('75%','90%',110,60,'var(--peach)',0,0.85);
  html += '<header class="page-header">';
  html += '<div class="t-mono label">— Teaching</div>';
  html += '<h1 class="t-display">Teaching &amp; TA work<span class="dot">.</span></h1></header>';
  html += '<section class="teaching-philosophy" style="margin-top:32px">';
  S.teaching.blurb.forEach(function(p){ html += '<p class="t-body">'+p+'</p>'; });
  html += '</section>';
  html += '<section class="courses-section">';
  html += '<div class="t-mono" style="opacity:0.7;margin-bottom:8px;border-bottom:1px solid rgba(20,38,31,0.2);padding-bottom:10px">— Experience</div>';
  S.teaching.items.forEach(function(c){
    html += '<article class="course-row">'
      + '<div class="t-mono course-code">'+c.code+'</div>'
      + '<div><div class="t-display course-title">'+c.title+'</div>'
      + '<div class="t-body course-blurb">'+c.blurb+'</div></div>'
      + '<div class="t-body course-level">'+c.institution+'</div>'
      + '<div class="t-mono course-meta">'+c.status+'</div>'
      + '</article>';
  });
  html += '</section></div>';

  // ════════════════ PROJECTS ════════════════
  html += '<div class="page page-dark" id="page-projects">';
  html += pebble('5%','-3%',130,15,'var(--cream)',3,0.8);
  html += pebble('52%','92%',120,-45,'var(--bean)',1,0.8);
  html += pebble('85%','3%',90,25,'var(--pink)',2,0.75);
  html += '<header class="page-header">';
  html += '<div class="t-mono label">— Projects</div>';
  html += '<h1 class="t-display">Projects<span class="dot">.</span></h1>';
  html += '<p class="t-body desc">'+S.projectsBlurb+'</p></header>';
  html += '<section class="projects-grid">';
  S.projects.forEach(function(p){ html += projectCard(p); });
  html += '</section></div>';

  document.getElementById('pageContainer').innerHTML = html;

  // ── Page switching ──
  var root = document.getElementById('themeRoot');
  var footer = document.getElementById('siteFooter');
  var pills = document.querySelectorAll('.nav-pill');
  var pages = document.querySelectorAll('.page');

  var PAGE_BG = { home: '#1F3A32', research: '#AFCDDD', teaching: '#9CC5B2', projects: '#D98E62' };
  var PAGE_FG = { home: '#F3EFE4', research: '#14261F', teaching: '#14261F', projects: '#14261F' };
  var PILL_BG = { home: '#14261F', research: '#AFCDDD', teaching: '#9CC5B2', projects: '#D98E62' };
  var PILL_FG = { home: '#F3EFE4', research: '#14261F', teaching: '#14261F', projects: '#14261F' };

  function setPage(pageId) {
    root.style.background = PAGE_BG[pageId];
    root.style.color = PAGE_FG[pageId];
    footer.style.borderTop = pageId === 'home'
      ? '1px solid rgba(243,239,228,0.15)'
      : '1px solid rgba(20,38,31,0.15)';

    pages.forEach(function(p){ p.classList.remove('active'); });
    var target = document.getElementById('page-' + pageId);
    if (target) target.classList.add('active');

    // Active pill filled, inactive pills neutral cream outline
    pills.forEach(function(pill) {
      var id = pill.getAttribute('data-page');
      if (id === pageId) {
        pill.style.background = PILL_BG[id];
        pill.style.color = PILL_FG[id];
        pill.style.borderColor = PILL_BG[id];
      } else {
        pill.style.background = 'transparent';
        pill.style.color = '#F3EFE4';
        pill.style.borderColor = 'rgba(243,239,228,0.4)';
      }
    });

    /* --- Colored pill variant: each pill always shows its page color ---
    pills.forEach(function(pill) {
      var id = pill.getAttribute('data-page');
      if (id === pageId) {
        pill.style.background = PILL_BG[id];
        pill.style.color = PILL_FG[id];
        pill.style.borderColor = PILL_BG[id];
      } else {
        pill.style.background = 'transparent';
        pill.style.color = PILL_BG[id];
        pill.style.borderColor = PILL_BG[id];
      }
    });
    --- */

    try { localStorage.setItem('beautery_page', pageId); } catch(e) {}
    history.replaceState(null, '', pageId === 'home' ? '/' : '#' + pageId);
    window.scrollTo(0, 0);
  }

  pills.forEach(function(pill) {
    pill.addEventListener('click', function() { setPage(this.getAttribute('data-page')); });
  });

  var hash = location.hash.replace('#', '');
  var saved = null;
  try { saved = localStorage.getItem('beautery_page'); } catch(e) {}
  var initial = (hash && PAGE_BG[hash]) ? hash : (saved && PAGE_BG[saved]) ? saved : 'home';
  setPage(initial);
});
</script>

</body>
</html>
